<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E0C" />
      <stop offset="100%" stop-color="#121611" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(57, 255, 136, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)" />
  <rect width="1200" height="675" fill="url(#grid2)" />

  <circle cx="350" cy="350" r="280" fill="#39FF88" opacity="0.03" filter="blur(60px)" />

  <!-- Window Frame -->
  <rect x="80" y="70" width="1040" height="535" rx="12" fill="#121611" stroke="rgba(57, 255, 136, 0.15)" stroke-width="1" />
  
  <!-- Window Header -->
  <rect x="80" y="70" width="1040" height="48" rx="12" fill="#1A1F1C" />
  <rect x="80" y="106" width="1040" height="12" fill="#1A1F1C" />
  <circle cx="112" cy="94" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="132" cy="94" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="152" cy="94" r="6" fill="#10B981" opacity="0.8" />
  <text x="530" y="99" fill="#8A928D" font-family="monospace" font-size="13" letter-spacing="1">salespilot :: agent_orchestrator</text>

  <!-- Left: Agents status -->
  <rect x="110" y="140" width="350" height="430" rx="8" fill="#0A0E0C" stroke="rgba(57, 255, 136, 0.08)" />
  <text x="135" y="180" fill="#39FF88" font-family="monospace" font-size="13" font-weight="bold">// AGENT WORKFLOW STATE</text>

  <rect x="135" y="205" width="300" height="48" rx="6" fill="#1A1F1C" />
  <text x="150" y="235" fill="#39FF88" font-family="monospace" font-size="12">● LeadResearchAgent [RUNNING]</text>

  <rect x="135" y="265" width="300" height="48" rx="6" fill="#1A1F1C" />
  <text x="150" y="295" fill="#39FF88" font-family="monospace" font-size="12">● PersonalizationAgent [IDLE]</text>

  <rect x="135" y="325" width="300" height="48" rx="6" fill="#1A1F1C" />
  <text x="150" y="355" fill="#E8ECEA" font-family="monospace" font-size="12">○ EmailDispatchWorker [QUEUED]</text>

  <text x="135" y="420" fill="#8A928D" font-family="monospace" font-size="11">CELERY: 11 CONCURRENT QUEUES</text>
  <text x="135" y="445" fill="#8A928D" font-family="monospace" font-size="11">LOCKING: ROW-LEVEL IDEMPOTENCY</text>
  <text x="135" y="470" fill="#8A928D" font-family="monospace" font-size="11">STACK: 6-SERVICE DOCKER STACK</text>
  <text x="135" y="495" fill="#39FF88" font-family="monospace" font-size="11">DISPATCH: ORG-SCOPED ISOLATION</text>

  <!-- Right: Architecture & Terminal -->
  <text x="490" y="185" fill="#E8ECEA" font-family="sans-serif" font-size="34" font-weight="bold" letter-spacing="-1">SalesPilot AI</text>
  <text x="490" y="215" fill="#8A928D" font-family="sans-serif" font-size="15">Multi-Tenant Autonomous Sales Agent Platform</text>

  <rect x="490" y="245" width="600" height="325" rx="8" fill="#0A0E0C" stroke="rgba(57, 255, 136, 0.08)" />
  <text x="515" y="280" fill="#8A928D" font-family="monospace" font-size="13">from <tspan fill="#39FF88">langgraph.graph</tspan> import StateGraph, END</text>
  <text x="515" y="310" fill="#E8ECEA" font-family="monospace" font-size="13">workflow = StateGraph(SalesOutreachState)</text>
  <text x="515" y="340" fill="#8A928D" font-family="monospace" font-size="13">workflow.add_node("research", conduct_lead_intelligence)</text>
  <text x="515" y="370" fill="#8A928D" font-family="monospace" font-size="13">workflow.add_node("craft_email", draft_hyper_personalized)</text>
  <text x="515" y="400" fill="#39FF88" font-family="monospace" font-size="13">workflow.add_conditional_edges("evaluate", should_send)</text>
  <text x="515" y="430" fill="#E8ECEA" font-family="monospace" font-size="13">app = workflow.compile(checkpointer=MemorySaver())</text>

  <text x="515" y="490" fill="#39FF88" font-family="monospace" font-size="12">> redis_beat: 450 scheduled sequences processed</text>
  <text x="515" y="520" fill="#8A928D" font-family="monospace" font-size="12">> worker_03: response latency 180ms | Stripe webhooks [ACK]</text>
</svg>
