<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E0C" />
      <stop offset="100%" stop-color="#121611" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF88" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(57, 255, 136, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Glow effect -->
  <circle cx="850" cy="300" r="280" fill="#39FF88" opacity="0.04" filter="blur(60px)" />

  <!-- Window Frame -->
  <rect x="80" y="70" width="1040" height="535" rx="12" fill="#121611" stroke="rgba(57, 255, 136, 0.15)" stroke-width="1" />
  
  <!-- Window Header -->
  <rect x="80" y="70" width="1040" height="48" rx="12" fill="#1A1F1C" />
  <rect x="80" y="106" width="1040" height="12" fill="#1A1F1C" />
  <circle cx="112" cy="94" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="132" cy="94" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="152" cy="94" r="6" fill="#10B981" opacity="0.8" />
  <text x="540" y="99" fill="#8A928D" font-family="monospace" font-size="13" letter-spacing="1">codex-edumine :: system_core</text>

  <!-- Left Sidebar / Stats -->
  <rect x="110" y="140" width="300" height="430" rx="8" fill="#0A0E0C" stroke="rgba(57, 255, 136, 0.08)" />
  <text x="135" y="180" fill="#39FF88" font-family="monospace" font-size="13" font-weight="bold">// MODULES ACTIVE</text>
  
  <rect x="135" y="205" width="250" height="38" rx="6" fill="#1A1F1C" />
  <text x="150" y="229" fill="#E8ECEA" font-family="monospace" font-size="12">✓ Biometric Attendance</text>

  <rect x="135" y="255" width="250" height="38" rx="6" fill="#1A1F1C" />
  <text x="150" y="279" fill="#E8ECEA" font-family="monospace" font-size="12">✓ OMR Sheet Scanner</text>

  <rect x="135" y="305" width="250" height="38" rx="6" fill="#1A1F1C" />
  <text x="150" y="329" fill="#E8ECEA" font-family="monospace" font-size="12">✓ Academic Scheduling</text>

  <rect x="135" y="355" width="250" height="38" rx="6" fill="#1A1F1C" />
  <text x="150" y="379" fill="#E8ECEA" font-family="monospace" font-size="12">✓ Automated Results</text>

  <text x="135" y="440" fill="#8A928D" font-family="monospace" font-size="11">RBAC: 8 ROLES CONFIGURED</text>
  <text x="135" y="465" fill="#8A928D" font-family="monospace" font-size="11">STACK: FASTAPI + NEXT.JS 19</text>
  <text x="135" y="490" fill="#39FF88" font-family="monospace" font-size="11">DB: ASYNC POSTGRESQL</text>

  <!-- Right Visual: Title & Terminal Code -->
  <text x="440" y="185" fill="#E8ECEA" font-family="sans-serif" font-size="34" font-weight="bold" letter-spacing="-1">Codex Edumine</text>
  <text x="440" y="215" fill="#8A928D" font-family="sans-serif" font-size="15">Enterprise Educational ERP &amp; Computer-Vision Grading System</text>

  <rect x="440" y="245" width="650" height="325" rx="8" fill="#0A0E0C" stroke="rgba(57, 255, 136, 0.08)" />
  <text x="465" y="280" fill="#8A928D" font-family="monospace" font-size="13">class <tspan fill="#39FF88">OMRProcessor</tspan>:</text>
  <text x="485" y="310" fill="#E8ECEA" font-family="monospace" font-size="13">async def process_sheet(image_buffer: bytes):</text>
  <text x="505" y="340" fill="#8A928D" font-family="monospace" font-size="13">contours = cv2.findContours(thresholded, cv2.RETR_EXTERNAL)</text>
  <text x="505" y="370" fill="#8A928D" font-family="monospace" font-size="13">bubbles = detect_answer_grid(contours, grid_size=(25, 4))</text>
  <text x="505" y="400" fill="#39FF88" font-family="monospace" font-size="13">accuracy_score = evaluate_student_sheet(bubbles, answer_key)</text>
  <text x="505" y="430" fill="#E8ECEA" font-family="monospace" font-size="13">return GradingResult(score=accuracy_score, status="VERIFIED")</text>
  
  <text x="465" y="490" fill="#39FF88" font-family="monospace" font-size="12">> pipeline: verified 1,420 answer sheets in 4.2s (avg: 2.9ms/sheet)</text>
  <text x="465" y="520" fill="#8A928D" font-family="monospace" font-size="12">> deploy: GitHub Actions -> VM (Nginx + systemd + SSL) [ONLINE]</text>
</svg>
